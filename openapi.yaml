components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: remitwise-session
      description: Iron Session cookie for authenticated users
    xUserHeader:
      type: apiKey
      in: header
      name: x-user
      description: Stellar public key of the caller
  parameters:
    AcceptLanguageHeader:
      in: header
      name: Accept-Language
      required: false
      schema:
        type: string
        example: es
      description: 'Optional header to request localized responses. Supported languages: ''en'' (English), ''es'' (Spanish).'
  schemas:
    ApiError:
      type: object
      properties:
        error:
          type: string
          description: |
            A translated error message based on the Accept-Language header.
            If the translation is missing or language is not supported, defaults to English.
            Example translations:
             - en: "Unauthorized: missing or invalid x-user header"
             - es: "No autorizado: falta o es inválido el encabezado x-user"
          example: 'Unauthorized: missing or invalid x-user header'
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
            - unhealthy
          example: ok
        database:
          type: string
          enum:
            - ok
            - error
          example: ok
        rpc:
          type: string
          enum:
            - ok
            - error
          example: ok
        anchor:
          type: string
          enum:
            - ok
            - error
            - skipped
          example: ok
    RemittanceQuoteResponse:
      type: object
      properties:
        sendAmount:
          type: number
          example: 100
        receiveAmount:
          type: number
          example: 5600.5
        fee:
          type: number
          example: 1.5
        rate:
          type: number
          example: 56
        expiry:
          type: string
          format: date-time
          example: '2023-10-12T07:20:50.52Z'
        source:
          type: string
          enum:
            - anchor
            - stellar
          example: anchor
    BuildRemittanceRequest:
      type: object
      required:
        - amount
        - recipientAddress
      properties:
        amount:
          type: number
          example: 250
        currency:
          type: string
          default: USDC
          example: USDC
        recipientAddress:
          type: string
          example: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
        memo:
          type: string
          maxLength: 28
          example: Monthly support
    BuildRemittanceResponse:
      type: object
      properties:
        xdr:
          type: string
          example: AAAAAgAAAAA...
        networkPassphrase:
          type: string
          example: Test SDF Network ; September 2015
        simulate:
          type: object
          properties:
            fee:
              type: string
              example: '100'
            success:
              type: boolean
              example: true
    RemittanceHistoryResponse:
      type: object
      properties:
        userAddress:
          type: string
          example: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
      additionalProperties: true
    RemittanceStatusResponse:
      type: object
      properties:
        hash:
          type: string
          example: d41d8cd98f00b204e9800998ecf8427e
        status:
          type: object
          additionalProperties: true
    SplitCalculateResponse:
      type: object
      properties:
        amounts:
          type: object
          additionalProperties: true
          example:
            savings: 300
            bills: 200
            insurance: 50
    SplitPercentages:
      type: object
      required:
        - spending
        - savings
        - bills
        - insurance
      properties:
        spending:
          type: number
          example: 50
        savings:
          type: number
          example: 25
        bills:
          type: number
          example: 20
        insurance:
          type: number
          example: 5
    SplitUpdateResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        xdr:
          type: string
          example: AAAAAgAAAAA...
        simulate:
          type: object
          additionalProperties: true
        message:
          type: string
          example: Successfully updated split percentages
    CreateBillRequest:
      type: object
      required:
        - name
        - amount
        - dueDate
      properties:
        name:
          type: string
          example: Electric Bill
        amount:
          type: number
          example: 120.5
        dueDate:
          type: string
          format: date-time
          example: '2023-10-15T00:00:00Z'
        recurring:
          type: boolean
          default: false
          example: true
        frequencyDays:
          type: number
          example: 30
    XdrResponse:
      type: object
      properties:
        xdr:
          type: string
          example: AAAAAgAAAAA...
    BillDueSoon:
      type: object
      required:
        - billId
        - name
        - amount
        - dueDate
      properties:
        billId:
          type: string
          example: bill_123456
        name:
          type: string
          example: Electric Bill
        amount:
          type: number
          example: 120.5
        dueDate:
          type: string
          format: date-time
          example: '2023-10-15T00:00:00Z'
    CreateInsuranceRequest:
      type: object
      required:
        - name
        - coverageType
        - monthlyPremium
        - coverageAmount
      properties:
        name:
          type: string
          example: Health Insurance
        coverageType:
          type: string
          example: Medical
        monthlyPremium:
          type: number
          example: 250
        coverageAmount:
          type: number
          example: 100000
    SessionRefreshResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            address:
              type: string
              description: Stellar wallet public key of the authenticated user
              example: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
            expiresAt:
              type: number
              description: Session expiry timestamp in milliseconds since epoch
              example: 1700000000000
    WebhookDlqResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            events:
              type: array
              items:
                type: object
            pagination:
              type: object
              properties:
                limit:
                  type: integer
                  example: 50
                offset:
                  type: integer
                  example: 0
                total:
                  type: integer
                  example: 5
                hasMore:
                  type: boolean
                  example: false
            stats:
              type: object
              example:
                pending: 0
                processing: 0
                processed: 100
                failed: 5
                dlq: 5
                total: 110
