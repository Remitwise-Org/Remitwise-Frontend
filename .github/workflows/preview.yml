name: Preview Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: npm

      # Vercel deploy only runs once a maintainer has added VERCEL_TOKEN /
      # VERCEL_ORG_ID / VERCEL_PROJECT_ID as repo secrets. Until then this
      # job is a no-op instead of a failing check.
      - name: Check Vercel secrets are configured
        id: has-secrets
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ] && [ -n "${{ secrets.VERCEL_ORG_ID }}" ] && [ -n "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy preview to Vercel
        if: steps.has-secrets.outputs.configured == 'true'
        id: deploy
        uses: amondnet/vercel-action@16e87c0a08142b0d0d33b76aeaf20823c381b9b9 # v25.2.0
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          github-comment: false

      - name: Format preview comment
        if: steps.has-secrets.outputs.configured == 'true'
        id: comment
        run: node scripts/emit-preview-comment.mjs
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview-url }}

      - name: Post preview comment
        if: steps.has-secrets.outputs.configured == 'true'
        uses: marocchino/sticky-pull-request-comment@52423e01640425a022ef5fd42c6fb5f633a02728 # v2.9.1
        with:
          header: preview-url
          message: ${{ steps.comment.outputs.body }}
