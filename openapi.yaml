      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
            maximum: 200
          example: 20
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum:
              - completed
              - failed
              - pending
          example: completed
      responses:
        '200':
          description: History records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemittanceHistoryResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
