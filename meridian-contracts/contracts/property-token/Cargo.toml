[package]
name = "property-token"
version = "1.0.0"
authors = ["PropChain Team <dev@propchain.io>"]
edition = "2021"
license = "MIT"
description = "Property token standard with ERC-721 and ERC-1155 compatibility"

# Detach from the Soroban-focused parent workspace so ink deps resolve cleanly.
[workspace]

[dependencies]
ink = { version = "5.1.1", default-features = false }
propchain-traits = { path = "../traits", default-features = false }
stellar-insured-lib = { path = "../lib", default-features = false, features = ["ink"] }

scale = { package = "parity-scale-codec", version = "3.6.9", default-features = false, features = ["derive"] }
scale-info = { version = "2.10.0", default-features = false, features = ["derive"] }

[lib]
path = "src/lib.rs"

[features]
default = ["std"]
std = [
    "ink/std",
    "scale/std",
    "scale-info/std",
    "propchain-traits/std",
    "stellar-insured-lib/std",
]
ink-as-dependency = []
verification = ["proptest"]
