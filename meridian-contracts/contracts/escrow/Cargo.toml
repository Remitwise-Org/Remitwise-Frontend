[package]
name = "propchain-escrow"
version = "1.0.0"
authors = ["PropChain Team <dev@propchain.io>"]
edition = "2021"
description = "Advanced escrow system for property transactions with multi-signature support"
license = "MIT"
homepage = "https://propchain.io"
repository = "https://github.com/MettaChain/PropChain-contract"
keywords = ["blockchain", "real-estate", "smart-contracts", "ink", "escrow"]
categories = ["cryptography::cryptocurrencies"]
publish = false

[dependencies]
soroban-sdk = { workspace = true }
stellar-insured-lib = { path = "../lib" }

[dependencies.kani]
version = "0.60"
workspace = true
optional = true

[dependencies.proptest]
version = "1.4"
workspace = true
default-features = false
features = ["std"]
optional = true

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[lib]
name = "propchain_escrow"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["std"]
std = ["soroban-sdk/testutils"]
testutils = ["soroban-sdk/testutils"]
verification = ["kani", "proptest", "stellar-insured-lib/verification"]
