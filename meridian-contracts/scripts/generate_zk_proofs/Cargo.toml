[package]
name = "generate-zk-proofs"
version = "0.1.0"
edition = "2021"
description = "Off-chain Groth16 (Bn254) proof generator for PropChain ZK compliance, oracle, and AI-valuation contracts"
publish = false

# Standalone: detach from the Soroban-focused parent workspace.
[workspace]

[dependencies]
ark-bn254 = "0.4"
ark-ff = "0.4"
ark-groth16 = "0.4"
ark-relations = "0.4"
ark-serialize = "0.4"
ark-snark = "0.4"
blake2 = "0.10"
hex = "0.4"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
